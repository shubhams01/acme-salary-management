services:
  postgres:
    image: postgres:17-alpine
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_dev_password
      POSTGRES_DB: acme_salary
    ports:
      - "5432:5432"
    volumes:
      - acme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_user -d acme_salary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  acme_postgres_data: